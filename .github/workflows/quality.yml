name: secret-base-quality
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q server.py video_engine.py
      - name: Regression and safety tests
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q
