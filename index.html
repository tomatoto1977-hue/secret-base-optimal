ynPUpqdrnzFB8KviBBarAdBQhOmJRRX095jep/Oiur67MzWGij/9k="};const PHOTO_KEYS=['plan','mkt','rev','info','bud','write','evi','vid','edit','impl','save','boss'];const people=[['企画','まいか','plan','企画・構成'],['市場調査','りょう','mkt','需要・競合'],['収益設計','たくや','rev','収益モデル'],['情報整理','はると','info','情報収集'],['予算管理','りの','bud','コスト管理'],['文章制作','れん','write','本文・コピー'],['根拠確認','あかり','evi','事実・根拠'],['動画制作','かい','vid','動画・素材'],['編集','なな','edit','最終編集'],['実装','ゆい','impl','システム実装'],['保存','司書(仮)','save','成果物・記録'],['統括補佐','さとる','boss','全体調整']];const colors=['#8979ff','#61b7e8','#ef7777','#e2aa55','#68c69a','#e2a3b8','#65bfa2','#ef9a63','#8979ff','#61b7e8','#b89b72','#efbb62'];const flow=[['指示受付','統括が目的を整理'],['企画','工程と担当を配分'],['調査','根拠と情報を確認'],['制作','成果物を作成'],['品質確認','95点ゲート'],['引き継ぎ','次工程へ渡す'],['完了','人間承認待ち']];const $=x=>document.getElementById(x);let running=false,logs=[];const sleep=m=>new Promise(r=>setTimeout(r,m));
function log(x){logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour12:false})+' '+x);$('feed').innerHTML=logs.slice(0,14).map(x=>'<div>'+x+'</div>').join('')}
function build(){ const moods=['💡','🔎','📈','📚','💰','✍️','🧾','🎬','🎨','💻','🗂️','🧭']; $('agents').innerHTML=people.map((p,i)=>'<article class="agent waiting" id="a'+i+'"><span class="mood">'+moods[i]+'</span><span class="state wait">待機中</span><div class="person"><div class="avatar" style="--c:'+colors[i]+'">'+(PHOTO[p[2]]?'<img src="'+PHOTO[p[2]]+'" alt="'+p[1]+'">':p[2])+'</div><div><b>'+p[0]+'・'+p[1]+'</b><div class="roleline"><span class="dot"></span><small>'+p[3]+'</small></div></div></div><div class="task">待機しています</div><div class="next">次工程：指示受付待ち</div><div class="bar"><i></i></div><div class="pct">0%</div></article>').join('');$('flow').innerHTML=flow.map((x,i)=>'<div class="step" id="s'+i+'"><span class="n">'+(i+1)+'</span><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><strong>待機</strong></div>').join('');log('秘密基地に12人が集合。統括への指示を待っています。')}
function state(i,type,task,p){let e=$('a'+i),s=e.querySelector('.state');const cls=type==='work'?'active':type==='check'?'check':type==='handoff'?'active':type==='done'?'done':'waiting';e.className='agent '+cls;s.textContent=type==='work'?'作業中':type==='check'?'確認中':type==='handoff'?'引き継ぎ':type==='done'?'完了':'待機中';s.className='state '+(type||'wait');e.querySelector('.task').textContent=task;e.querySelector('.next').textContent=type==='handoff'?'次工程へ成果物を受け渡し中':type==='done'?'工程完了':'次工程：'+(type==='work'?'品質確認':type==='check'?'合否判定':'—');e.querySelector('.bar i').style.width=p+'%';e.querySelector('.pct').textContent=p+'%';e.setAttribute('aria-label',p[0]||'')}
function step(i,t){let e=$('s'+i);e.className='step '+(t==='active'?'active':t==='done'?'done':'');e.querySelector('strong').textContent=t==='active'?'進行中':t==='done'?'完了':'待機'}
async function run(){if(running)return;running=true;$('go').textContent='実行中…';$('overall').textContent='作業中';$('gate').textContent='95点以上で合格';$('gate').style.color='';$('result').classList.remove('show');let cmd=$('cmd').value.trim()||'新しい成果物を企画・制作してください';log('統括・さとる：指示「'+cmd+'」を受領');step(0,'active');await sleep(400);step(0,'done');step(1,'active');await sleep(300);step(1,'done');step(2,'active');const order=[0,1,3,4,5,6,7,8,9,2,10,11];for(let k=0;k<order.length;k++){let i=order[k],p=people[i];state(i,'work',p[3]+'を実行中',0);log(p[0]+'・'+p[1]+'：作業開始');for(let n=20;n<=100;n+=20){state(i,'work',p[3]+'を実行中',n);await sleep(75)}state(i,'check','品質確認中',100);step(2,'active');await sleep(140);let score=88+Math.floor(Math.random()*12);if(score<95){log(p[0]+'・'+p[1]+'：'+score+'点 → 修正へ');state(i,'work','ブラッシュアップ中',55);await sleep(180);score=95+Math.floor(Math.random()*6)}$('score').textContent=score+'点';log(p[0]+'・'+p[1]+'：'+score+'点 → 合格');state(i,'handoff','次工程へ引き継ぎ',100);await sleep(100);state(i,'done','工程完了・待機中',100)}step(2,'done');step(3,'active');await sleep(250);step(3,'done');step(4,'active');await sleep(250);step(4,'done');step(5,'active');await sleep(250);step(5,'done');step(6,'active');await sleep(250);step(6,'done');$('overall').textContent='人間承認待ち';$('score').textContent='95+';$('gate').textContent='✅ 品質ゲート通過';$('gate').style.color='#65cf96';$('resultText').textContent='「'+cmd+'」の全工程が完了。成果物は人間承認待ちです。外部投稿・送信は実行していません。';$('result').classList.add('show');log('統括・さとる：全工程完了。成果物を人間承認へ返却。');$('go').textContent='もう一度実行';running=false}
$('go').onclick=run;$('reset').onclick=()=>location.reload();history.scrollRestoration='manual';build();document.querySelector('.boss .face').innerHTML='<img src="'+PHOTO.boss+'" alt="統括・さとる">';setTimeout(()=>window.scrollTo({top:0,left:0,behavior:'instant'}),80);setTimeout(()=>window.scrollTo({top:0,left:0,behavior:'instant'}),500);
