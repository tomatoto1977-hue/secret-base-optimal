<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17141b"><meta name="apple-mobile-web-app-capable" content="yes"><title>秘密基地・最適版</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--bg:#111016;--panel:#211d29;--line:#40384d;--cream:#f5dfb7;--ink:#3c2c22;--violet:#8979ff;--green:#65cf96;--gold:#efbb62;--blue:#64b7e8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#3a3048,#111016 60%);color:#f7f4fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.app{max-width:1450px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#5e5098,#39736a);box-shadow:0 8px 25px #0006}.brand h1{margin:0;font-size:23px}.brand p{margin:3px 0 0;color:#aaa1b2;font-size:11px}.boss{display:flex;align-items:center;gap:9px;background:#221e2b;border:1px solid #4a4255;border-radius:16px;padding:8px 12px}.boss .face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f3d7b0;border:2px solid var(--gold);font-size:22px}.boss small{display:block;color:#aaa1b2;font-size:9px}.command{margin-top:12px;background:#1d1924;border:1px solid #433a50;border-radius:18px;padding:12px}.cmdrow{display:grid;grid-template-columns:1fr 110px 72px;gap:8px}.cmdrow input{min-width:0;background:#0e0c12;color:white;border:1px solid #51485d;border-radius:12px;padding:12px;outline:none}.btn{border:0;border-radius:12px;font-weight:900}.go{background:linear-gradient(135deg,#7568ff,#9c74ff);color:#fff}.reset{background:#2c2735;color:#ddd;border:1px solid #4b4354}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:9px;padding:6px 9px;border-radius:99px;background:#292430;color:#c9c1ce;border:1px solid #443c4c}.chip.on{background:#332d51;border-color:#7163df;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-top:12px}.room{background:linear-gradient(180deg,#f6e5c3,#e8c995);border:1px solid #6d5945;border-radius:20px;padding:12px;color:var(--ink)}.roomtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.roomtitle h2{margin:0;font-size:16px}.badge{background:#5b4636;color:#fff;border-radius:99px;padding:5px 8px;font-size:9px}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.agent{position:relative;min-height:140px;padding:10px;background:#fff8eb;border:2px solid #d3b285;border-radius:16px;box-shadow:0 7px 16px #71553825;transition:.2s}.agent.active{transform:translateY(-2px);border-color:#7568ef;box-shadow:0 0 0 3px #7568ef25}.agent.done{border-color:#68a883}.agent.check{border-color:#d69d3c}.state{position:absolute;right:7px;top:7px;font-size:8px;font-weight:900;border-radius:99px;padding:4px 7px;background:#e8ddce;box-shadow:0 2px 5px #0001}.state.wait{background:#eee9e2;color:#6e6258}.state.work{background:#e2ddff;color:#5147a5}.state.check{background:#ffefc9;color:#8b641f}.state.handoff{background:#d9edf7;color:#28637d}.state.done{background:#d8f0e2;color:#357050}.person{display:flex;gap:8px;align-items:center;padding-right:55px}.mood{position:absolute;left:9px;top:8px;font-size:11px;opacity:.9}.roleline{display:flex;gap:5px;align-items:center;margin-top:3px}.roleline small{color:#78695d;font-size:8px}.roleline .dot{width:5px;height:5px;border-radius:50%;background:var(--c)}.avatar{width:47px;height:47px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#fff,#eee0d0);border:3px solid var(--c);flex:none}.person b{font-size:11px}.person small{display:block;color:#78695d;font-size:8px;margin-top:2px}.task{margin-top:10px;font-size:9px;font-weight:900;min-height:24px}.next{font-size:7px;color:#817063;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:5px;background:#e8d9c6;border-radius:99px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7568ef,#5eb5df);transition:.25s}.pct{font-size:7px;color:#857466;text-align:right;margin-top:4px}.side{display:flex;flex-direction:column;gap:10px}.panel{background:#201c27;border:1px solid #433a4e;border-radius:18px;padding:12px}.panel h3{margin:0 0 9px;font-size:13px}.flow{display:flex;flex-direction:column;gap:6px}.step{display:grid;grid-template-columns:25px 1fr auto;gap:7px;align-items:center;padding:7px;background:#292430;border:1px solid #3b3444;border-radius:10px}.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#3a3343;font-size:8px}.step b{font-size:9px}.step small{display:block;color:#aaa1b2;font-size:7px;margin-top:2px}.step strong{font-size:8px;color:#aaa1b2}.step.active{border-color:#7568ef;background:#302a48}.step.done{border-color:#4c8064}.quality{text-align:center}.score{font-size:34px;font-weight:1000;color:var(--gold)}.quality small{display:block;color:#aaa1b2;font-size:8px}.gate{margin-top:6px;font-size:9px;font-weight:900}.feed{max-height:190px;overflow:auto}.feed div{font-size:8px;line-height:1.5;color:#c9c1ce;padding:6px 0;border-bottom:1px dashed #393341}.feed b{color:#eecb83}.result{display:none}.result.show{display:block}.result p{font-size:8px;color:#bdb4c3;line-height:1.5}.safe{margin-top:9px;color:#91d5b0;font-size:8px}
@media(max-width:850px){.app{padding:9px}.head{align-items:stretch;flex-direction:column}.boss{align-self:stretch}.cmdrow{grid-template-columns:1fr 82px}.reset{display:none}.layout{grid-template-columns:1fr}.agents{grid-template-columns:repeat(2,1fr)}.side{order:2}.flow{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.brand h1{font-size:18px}.brand p{font-size:8px}.logo{width:45px;height:45px;font-size:24px}.command{padding:8px}.cmdrow input{font-size:12px;padding:10px}.agents{gap:7px}.agent{min-height:135px;padding:8px}.avatar{width:41px;height:41px;font-size:22px;border-radius:12px}.person b{font-size:9px}.person small{font-size:7px}.task{font-size:8px}.flow{grid-template-columns:1fr}.panel{padding:10px}}
</style></head><body><div class="app">
<header class="head"><div class="brand"><div class="logo">🏡</div><div><h1>秘密基地・最適版</h1><p>秘密基地の世界観 × AI開発室の工程管理</p></div></div><div class="boss"><div class="face">🧑🏻‍💼</div><div><b>統括・さとる</b><small>指示 / 配分 / 品質承認</small></div></div></header>
<section class="command"><div class="cmdrow"><input id="cmd" placeholder="統括への指示　例：新作動画の企画を作ってください"><button class="btn go" id="go">指示を開始</button><button class="btn reset" id="reset">リセット</button></div><div class="chips"><span class="chip on">🧪 シミュレーション</span><span class="chip on">🔍 95点品質ゲート</span><span class="chip on">🔄 工程引き継ぎ</span><span class="chip">🛡 外部投稿なし</span><span class="chip">👤 人間承認必須</span></div></section>
<div class="layout"><section class="room"><div class="roomtitle"><div><h2>🪵 作業室　12人の担当席</h2><div style="font-size:8px;color:#806f60;margin-top:3px">工程状態と気分演出を分離して表示</div></div><span class="badge" id="overall">待機中</span></div><div style="display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px;font-size:7px"><span style="background:#eee9e2;padding:4px 7px;border-radius:99px">● 待機中</span><span style="background:#e2ddff;padding:4px 7px;border-radius:99px">● 作業中</span><span style="background:#ffefc9;padding:4px 7px;border-radius:99px">● 確認中</span><span style="background:#d9edf7;padding:4px 7px;border-radius:99px">↗ 引き継ぎ</span><span style="background:#d8f0e2;padding:4px 7px;border-radius:99px">✓ 完了</span></div><div class="agents" id="agents"></div></section>
<aside class="side"><section class="panel"><h3>🧭 工程フロー</h3><div class="flow" id="flow"></div></section><section class="panel quality"><div class="score" id="score">—</div><small>品質スコア</small><div class="gate" id="gate">95点以上で合格</div></section><section class="panel"><h3>📜 やり取りログ</h3><div class="feed" id="feed"></div></section><section class="panel result" id="result"><b>📦 成果物</b><p id="resultText"></p><div class="safe">公開・送信は人間承認まで停止しています。</div></section></aside></div></div>
<script>
const people=[['企画','まいか','🧑🏻‍🎨','企画・構成'],['市場調査','りょう','🧑🏻‍💻','需要・競合'],['収益設計','たくや','🧑🏻‍💼','収益モデル'],['情報整理','はると','👨🏻‍💻','情報収集'],['予算管理','りの','👩🏻‍💼','コスト管理'],['文章制作','れん','🧑🏻‍🎨','本文・コピー'],['根拠確認','あかり','👩🏻‍🔬','事実・根拠'],['動画制作','かい','🧑🏻‍🎬','動画・素材'],['編集','なな','👩🏻‍🎨','最終編集'],['実装','ゆい','👩🏻‍💻','システム実装'],['保存','司書(仮)','📚','成果物・記録'],['統括補佐','さとる','🧑🏻‍💼','全体調整']];const colors=['#8979ff','#61b7e8','#ef7777','#e2aa55','#68c69a','#e2a3b8','#65bfa2','#ef9a63','#8979ff','#61b7e8','#b89b72','#efbb62'];const flow=[['指示受付','統括が目的を整理'],['企画','工程と担当を配分'],['調査','根拠と情報を確認'],['制作','成果物を作成'],['品質確認','95点ゲート'],['引き継ぎ','次工程へ渡す'],['完了','人間承認待ち']];const $=x=>document.getElementById(x);let running=false,logs=[];const sleep=m=>new Promise(r=>setTimeout(r,m));
function log(x){logs.unshift(new Date().toLocaleTimeString('ja-JP',{hour12:false})+' '+x);$('feed').innerHTML=logs.slice(0,14).map(x=>'<div>'+x+'</div>').join('')}
function build(){ $('agents').innerHTML=people.map((p,i)=>'<article class="agent" id="a'+i+'"><span class="state">待機中</span><div class="person"><div class="avatar" style="--c:'+colors[i]+'">'+p[2]+'</div><div><b>'+p[0]+'・'+p[1]+'</b><small>'+p[3]+'</small></div></div><div class="task">待機しています</div><div class="next">次工程：—</div><div class="bar"><i></i></div><div class="pct">0%</div></article>').join('');$('flow').innerHTML=flow.map((x,i)=>'<div class="step" id="s'+i+'"><span class="n">'+(i+1)+'</span><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><strong>待機</strong></div>').join('');log('秘密基地に12人が集合。統括への指示を待っています。')}
function state(i,type,task,p){let e=$('a'+i),s=e.querySelector('.state');const cls=type==='work'?'active':type==='check'?'check':type==='handoff'?'active':type==='done'?'done':'waiting';e.className='agent '+cls;s.textContent=type==='work'?'作業中':type==='check'?'確認中':type==='handoff'?'引き継ぎ':type==='done'?'完了':'待機中';s.className='state '+(type||'wait');e.querySelector('.task').textContent=task;e.querySelector('.next').textContent=type==='handoff'?'次工程へ成果物を受け渡し中':type==='done'?'工程完了':'次工程：'+(type==='work'?'品質確認':type==='check'?'合否判定':'—');e.querySelector('.bar i').style.width=p+'%';e.querySelector('.pct').textContent=p+'%';e.setAttribute('aria-label',p[0]||'')}
function step(i,t){let e=$('s'+i);e.className='step '+(t==='active'?'active':t==='done'?'done':'');e.querySelector('strong').textContent=t==='active'?'進行中':t==='done'?'完了':'待機'}
async function run(){if(running)return;running=true;$('go').textContent='実行中…';$('overall').textContent='作業中';$('gate').textContent='95点以上で合格';$('gate').style.color='';$('result').classList.remove('show');let cmd=$('cmd').value.trim()||'新しい成果物を企画・制作してください';log('統括・さとる：指示「'+cmd+'」を受領');step(0,'active');await sleep(400);step(0,'done');step(1,'active');await sleep(300);step(1,'done');step(2,'active');const order=[0,1,3,4,5,6,7,8,9,2,10,11];for(let k=0;k<order.length;k++){let i=order[k],p=people[i];state(i,'work',p[3]+'を実行中',0);log(p[0]+'・'+p[1]+'：作業開始');for(let n=20;n<=100;n+=20){state(i,'work',p[3]+'を実行中',n);await sleep(75)}state(i,'check','品質確認中',100);step(2,'active');await sleep(140);let score=88+Math.floor(Math.random()*12);if(score<95){log(p[0]+'・'+p[1]+'：'+score+'点 → 修正へ');state(i,'work','ブラッシュアップ中',55);await sleep(180);score=95+Math.floor(Math.random()*6)}$('score').textContent=score+'点';log(p[0]+'・'+p[1]+'：'+score+'点 → 合格');state(i,'handoff','次工程へ引き継ぎ',100);await sleep(100);state(i,'done','工程完了・待機中',100)}step(2,'done');step(3,'active');await sleep(250);step(3,'done');step(4,'active');await sleep(250);step(4,'done');step(5,'active');await sleep(250);step(5,'done');step(6,'active');await sleep(250);step(6,'done');$('overall').textContent='人間承認待ち';$('score').textContent='95+';$('gate').textContent='✅ 品質ゲート通過';$('gate').style.color='#65cf96';$('resultText').textContent='「'+cmd+'」の全工程が完了。成果物は人間承認待ちです。外部投稿・送信は実行していません。';$('result').classList.add('show');log('統括・さとる：全工程完了。成果物を人間承認へ返却。');$('go').textContent='もう一度実行';running=false}
$('go').onclick=run;$('reset').onclick=()=>location.reload();history.scrollRestoration='manual';build();setTimeout(()=>window.scrollTo({top:0,left:0,behavior:'instant'}),80);setTimeout(()=>window.scrollTo({top:0,left:0,behavior:'instant'}),500);
</script></body></html>
