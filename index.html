<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>秘密基地・最適版 3.0</title>
<style>
:root{--bg:#0f1016;--panel:#191b25;--line:#303444;--text:#f5f3ee;--muted:#9da3b5;--gold:#efbd69;--ok:#65d39a;--bad:#ef7777;--violet:#8d7cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#393451,#0f1016 58%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.app{max-width:1250px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{font-size:28px;background:#262238;border:1px solid #50466d;border-radius:15px;padding:8px}.brand h1{margin:0;font-size:20px}.brand p{margin:3px 0;color:var(--muted);font-size:9px}.health{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#181923;font-size:9px}.health.ok{border-color:#3d795d;color:var(--ok)}.health.bad{border-color:#7b4141;color:var(--bad)}
.command,.panel{background:rgba(25,27,37,.96);border:1px solid var(--line);border-radius:15px;padding:11px}.command{margin-top:10px}.cmd{display:grid;grid-template-columns:1fr 110px;gap:7px}.cmd input,textarea,select{width:100%;background:#0c0d12;color:var(--text);border:1px solid #3a3e4f;border-radius:9px;padding:10px;outline:none}.btn{border:0;border-radius:9px;font-weight:900;background:linear-gradient(135deg,#7669ef,#9a72ff);color:#fff}.notice{margin-top:7px;color:var(--muted);font-size:8px;line-height:1.5}.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:10px;margin-top:10px}.room{background:linear-gradient(180deg,#f4e4c6,#e5c28b);color:#392b22;border-radius:17px;padding:10px}.room h2{font-size:14px;margin:0}.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.agent{background:#fff9ed;border:2px solid #d1b58b;border-radius:13px;padding:8px;min-height:120px;position:relative}.agent.work{border-color:#7568ef;box-shadow:0 0 0 3px #7568ef25}.agent.done{border-color:#64a981}.agent.fail{border-color:#d45c5c}.role{font-size:9px;font-weight:900}.name{font-size:8px;color:#66564a}.task{font-size:8px;font-weight:800;margin-top:10px;min-height:24px}.state{font-size:7px;position:absolute;right:6px;top:6px;background:#eee5d9;padding:4px 6px;border-radius:99px}.bar{height:4px;background:#dfd0ba;border-radius:99px;margin-top:8px}.bar i{display:block;height:100%;width:0;background:#7568ef;border-radius:99px}.side{display:flex;flex-direction:column;gap:9px}.panel h3{margin:0 0 7px;font-size:11px}.artifact{white-space:pre-wrap;max-height:360px;overflow:auto;background:#0c0d12;border:1px solid #353949;border-radius:10px;padding:9px;font-size:8px;line-height:1.65}.score{text-align:center;font-size:30px;font-weight:1000;color:var(--gold)}.small{font-size:8px;color:var(--muted);line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.history{max-height:180px;overflow:auto}.history div{padding:6px 0;border-bottom:1px dashed #343746;font-size:8px}.tag{display:inline-block;padding:3px 6px;border-radius:99px;background:#282b38;margin:2px;font-size:7px}.ok{color:var(--ok)}.bad{color:var(--bad)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.side{order:2}.agents{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.app{padding:7px}.agents{gap:5px}.agent{min-height:115px;padding:7px}.brand h1{font-size:17px}}
</style></head><body><div class="app">
<header><div class="brand"><div class="logo">🏡</div><div><h1>秘密基地・最適版 3.0</h1><p>実処理だけを「作業」として表示する再構築版</p></div></div><div id="health" class="health">接続確認中…</div></header>
<section class="command"><div class="cmd"><input id="command" placeholder="例：TikTok用の動画を作って下さい"><button id="run" class="btn">実行</button></div><div class="notice">⚠️ 実AIが接続されていない場合、成果物を捏造せず停止します。外部投稿・ログイン・金銭操作は行いません。人間承認が必須です。</div></section>
<div class="grid"><main class="room"><h2>🪵 実行エージェント</h2><div class="agents" id="agents"></div></main>
<aside class="side">
<section class="panel"><h3>📦 実成果物</h3><div id="artifactMeta" class="small">まだ実行されていません</div><pre id="artifact" class="artifact">—</pre></section>
<section class="panel"><h3>🎬 参考動画・最低品質基準</h3><div id="benchmark" class="small">読み込み中…</div></section><section class="panel"><h3>🧪 実行品質</h3><div id="score" class="score">—</div><div id="gate" class="small" style="text-align:center">実行待ち</div><div id="trace" class="small" style="margin-top:7px"></div></section>
<section class="panel"><h3>📝 成果物評価</h3><div class="small">保存した評価はサーバーへ送信し、次回生成の入力データになります。</div>
<input id="evTheme" placeholder="今回のテーマ" style="margin-top:6px"><div class="row" style="margin-top:6px">
<select id="evOverall"><option value="0">総合評価</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<select id="evVisual"><option value="0">映像品質</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<textarea id="evFailure" rows="2" placeholder="失敗・不満"></textarea><textarea id="evImprove" rows="2" placeholder="次回に必ず改善すること"></textarea><textarea id="evWorked" rows="2" placeholder="良かったので残すこと"></textarea>
<button id="saveEval" class="btn" style="width:100%;padding:10px;margin-top:6px">評価を保存</button><div id="evalStatus" class="small" style="margin-top:5px"></div></section>
<section class="panel"><h3>🧠 学習履歴</h3><div id="memory" class="history">読み込み中…</div></section>
</aside></div></div>
<script>
const API='https://secret-base-optimal-api.onrender.com';
const names=[['統括','さとる'],['市場調査','りょう'],['競争戦略','たくや'],['企画','まいか'],['情報収集','はると'],['予算','りの'],['文章化','れん'],['エビデンス','あかり'],['動画制作','かい'],['編集','なな'],['実装','ゆい']];
const $=id=>document.getElementById(id);let lastRunId=null,running=false;
function renderAgents(){ $('agents').innerHTML=names.map((x,i)=>'<div class="agent" id="a'+i+'"><span class="state">待機</span><div class="role">'+x[0]+'</div><div class="name">'+x[1]+'</div><div class="task">未実行</div><div class="bar"><i></i></div></div>').join('')}
function setAgent(i,state,task,pct){const a=$('a'+i);if(!a)return;a.className='agent '+state;a.querySelector('.state').textContent=state==='work'?'実行中':state==='done'?'完了':state==='fail'?'停止':'待機';a.querySelector('.task').textContent=task;a.querySelector('.bar i').style.width=pct+'%'}
async function health(){try{const r=await fetch(API+'/health');const j=await r.json();$('health').textContent=j.ai_configured?'● 実AI接続済み v'+j.version:'● 実AI未接続';$('health').className='health '+(j.ai_configured?'ok':'bad');if(j.benchmark)$('benchmark').innerHTML='<b>9:16 / 1080×1920</b><br>冒頭2秒フック／2〜6秒程度の画面変化／白字幕＋黒フチ／権利安全な音声／CTA／ウォーターマークなし';}catch(e){$('health').textContent='● API接続失敗';$('health').className='health bad';$('benchmark').textContent='基準APIに接続できません。'}}
async function loadMemory(){try{const r=await fetch(API+'/learning');const j=await r.json();$('memory').innerHTML=(j.items||[]).slice(-12).reverse().map(x=>'<div><b>'+new Date(x.created_at).toLocaleString('ja-JP')+'</b><br><span class="tag">総合 '+(x.overall||'—')+'/5</span><span class="tag">'+(x.run_id||'')+'</span><br>'+(x.improve||x.failure||'評価なし')+'</div>').join('')||'まだ学習履歴はありません。'}catch(e){$('memory').textContent='学習APIに接続できません。'}}
async function run(){if(running)return;running=true;$('run').disabled=true;$('run').textContent='実行中…';$('artifact').textContent='';$('trace').textContent='';$('score').textContent='—';$('gate').textContent='実処理中';renderAgents();const command=$('command').value.trim()||'新しい動画制作を企画してください';try{
 let memory=[];try{memory=JSON.parse(localStorage.getItem('sb3_learning')||'[]');if(!Array.isArray(memory))memory=[];}catch(e){memory=[]}
 for(let i=0;i<11;i++)setAgent(i,'work',i===0?'目的を整理・学習を取得':names[i][0]+'の実処理を待機',5);
 const res=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,learning:memory.slice(-12)})});
 const j=await res.json();if(!j.ok)throw new Error(j.error||'実行失敗');lastRunId=j.run_id;
 const trace=j.trace||[];for(let i=0;i<11;i++){const t=trace[i]||{};setAgent(i,t.status==='completed'?'done':'fail',t.output_summary||t.error||'処理結果なし',100)}
 $('artifactMeta').textContent='run_id: '+j.run_id+' ｜ 実AI: '+(j.ai_used?'使用':'未使用')+' ｜ 学習反映: '+(j.learning_applied?'YES':'NO');
 $('artifact').textContent=j.artifact||'成果物なし';$('score').textContent=(j.quality?.score??'—')+'点';$('gate').textContent=j.quality?.passed?'✅ 95点ゲート通過・人間承認待ち':'⚠️ 95点未達・再生成が必要';$('gate').className='small '+(j.quality?.passed?'ok':'bad');
 $('trace').textContent='実処理担当：'+trace.filter(x=>x.status==='completed').length+'/11 ｜ 引き継ぎ検証：'+(j.handoffs_valid?'OK':'NG')+' ｜ 固定台本：'+(j.static_template_detected?'検出':'なし');loadMemory();
 }catch(e){for(let i=0;i<11;i++)setAgent(i,'fail','実処理が確認できず停止',0);$('artifactMeta').textContent='安全停止';$('artifact').textContent=String(e);$('gate').textContent='⚠️ 実処理を確認できないため成果物を生成しません'}finally{running=false;$('run').disabled=false;$('run').textContent='実行'}}
async function saveEval(){if(!lastRunId){$('evalStatus').textContent='先に成果物を1件実行してください。';return}const body={run_id:lastRunId,theme:$('evTheme').value,overall:Number($('evOverall').value),visual:Number($('evVisual').value),failure:$('evFailure').value,improve:$('evImprove').value,worked:$('evWorked').value};try{const h=JSON.parse(localStorage.getItem('sb3_learning')||'[]');h.push(body);localStorage.setItem('sb3_learning',JSON.stringify(h.slice(-50)));const r=await fetch(API+'/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error);$('evalStatus').textContent='✅ 保存済み。次回生成の必須入力へ登録しました。';loadMemory()}catch(e){$('evalStatus').textContent='❌ 保存失敗：'+e}}
$('run').onclick=run;$('saveEval').onclick=saveEval;renderAgents();health();loadMemory();
</script></body></html>
