<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17141b">
<title>秘密基地・最適版</title>
<style>
:root{--bg:#111016;--panel:#211d29;--cream:#f5dfb7;--ink:#3c2c22;--violet:#8979ff;--green:#65cf96;--gold:#efbb62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#3a3048,#111016 60%);color:#f7f4fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:1450px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#5e5098,#39736a)}h1{font-size:21px;margin:0}.brand p{margin:3px 0 0;color:#aaa1b2;font-size:10px}
.boss{display:flex;align-items:center;gap:8px;background:#221e2b;border:1px solid #4a4255;border-radius:15px;padding:7px 10px}.bossFace{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#f3d7b0;border:2px solid var(--gold);font-size:22px}.boss small{display:block;color:#aaa1b2;font-size:8px}
.command{margin-top:10px;background:#1d1924;border:1px solid #433a50;border-radius:17px;padding:10px}.cmdrow{display:grid;grid-template-columns:1fr 110px 70px;gap:7px}.cmdrow input{min-width:0;background:#0e0c12;color:white;border:1px solid #51485d;border-radius:11px;padding:11px;outline:none}.btn{border:0;border-radius:11px;font-weight:900}.go{background:linear-gradient(135deg,#7568ff,#9c74ff);color:#fff}.reset{background:#2c2735;color:#ddd;border:1px solid #4b4354}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:8px;padding:5px 8px;border-radius:99px;background:#292430;color:#c9c1ce;border:1px solid #443c4c}.chip.on{background:#332d51;border-color:#7163df;color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;margin-top:10px}.room{background:linear-gradient(180deg,#f6e5c3,#e8c995);border:1px solid #6d5945;border-radius:19px;padding:10px;color:var(--ink)}.roomtitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.roomtitle h2{margin:0;font-size:15px}.badge{background:#5b4636;color:#fff;border-radius:99px;padding:5px 8px;font-size:8px}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.agent{position:relative;min-height:138px;padding:9px;background:#fff8eb;border:2px solid #d3b285;border-radius:15px;box-shadow:0 6px 15px #71553825;transition:.2s}.agent.active{transform:translateY(-2px);border-color:#7568ef;box-shadow:0 0 0 3px #7568ef25}.agent.done{border-color:#68a883}.agent.check{border-color:#d69d3c}
.state{position:absolute;right:6px;top:6px;font-size:8px;font-weight:900;border-radius:99px;padding:4px 6px;background:#eee9e2;color:#6e6258}.state.work{background:#e2ddff;color:#5147a5}.state.check{background:#ffefc9;color:#8b641f}.state.handoff{background:#d9edf7;color:#28637d}.state.done{background:#d8f0e2;color:#357050}
.person{display:flex;gap:7px;align-items:center;padding-right:50px}.avatar{width:47px;height:47px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,#fff,#eee0d0);border:3px solid var(--c);flex:none;overflow:hidden}.avatar .face{font-size:25px;line-height:1}.person b{font-size:10px}.person small{display:block;color:#78695d;font-size:7px;margin-top:2px}.roleline{display:flex;gap:4px;align-items:center;margin-top:3px}.dot{width:5px;height:5px;border-radius:50%;background:var(--c)}.mood{position:absolute;left:8px;top:7px;font-size:10px}.task{margin-top:9px;font-size:8px;font-weight:900;min-height:22px}.next{font-size:7px;color:#817063;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:5px;background:#e8d9c6;border-radius:99px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7568ef,#5eb5df);transition:.2s}.pct{font-size:7px;color:#857466;text-align:right;margin-top:3px}
.side{display:flex;flex-direction:column;gap:9px}.panel{background:#201c27;border:1px solid #433a4e;border-radius:17px;padding:11px}.panel h3{margin:0 0 8px;font-size:12px}.flow{display:flex;flex-direction:column;gap:5px}.step{display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:center;padding:6px;background:#292430;border:1px solid #3b3444;border-radius:9px}.step .n{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#3a3343;font-size:8px}.step b{font-size:8px}.step small{display:block;color:#aaa1b2;font-size:7px;margin-top:1px}.step strong{font-size:7px;color:#aaa1b2}.step.active{border-color:#7568ef;background:#302a48}.step.done{border-color:#4c8064}
.quality{text-align:center}.score{font-size:30px;font-weight:1000;color:var(--gold)}.quality small{display:block;color:#aaa1b2;font-size:8px}.gate{margin-top:5px;font-size:8px;font-weight:900}.feed{max-height:170px;overflow:auto}.feed div{font-size:8px;line-height:1.45;color:#c9c1ce;padding:5px 0;border-bottom:1px dashed #393341}
.result{display:block}.artifactStatus{margin-top:7px;font-size:9px;color:var(--green);font-weight:900}.artifactTitle{margin-top:6px;font-size:12px;font-weight:900;color:var(--cream)}.artifactPreview{margin:7px 0 0;max-height:330px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#0e0c12;border:1px solid #4b4354;border-radius:11px;padding:9px;color:#f2edf5;font:8px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}.artifactCopy{width:100%;margin-top:7px;border:0;border-radius:10px;padding:9px;background:#332d51;color:#fff;font-weight:900;font-size:9px}.safe{margin-top:7px;color:#91d5b0;font-size:8px}
@media(max-width:850px){.app{padding:8px}.head{align-items:stretch;flex-direction:column}.boss{align-self:stretch}.cmdrow{grid-template-columns:1fr 82px}.reset{display:none}.layout{grid-template-columns:1fr}.agents{grid-template-columns:repeat(2,1fr)}.side{order:2}}
@media(max-width:480px){h1{font-size:18px}.brand p{font-size:8px}.logo{width:44px;height:44px;font-size:23px}.agents{gap:7px}.agent{min-height:132px;padding:8px}.avatar{width:41px;height:41px;border-radius:12px}.person b{font-size:9px}.task{font-size:8px}.panel{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="brand"><div class="logo">🏡</div><div><h1>秘密基地・最適版</h1><p>秘密基地の世界観 × AI開発室の工程管理</p></div></div><div class="boss"><div class="bossFace">🧑🏻‍💼</div><div><b>統括・さとる</b><small>指示 / 配分 / 品質承認</small></div></div></header>
<section class="command"><div class="cmdrow"><input id="cmd" placeholder="統括への指示　例：新作動画の企画を作ってください"><button class="btn go" id="go">指示を開始</button><button class="btn reset" id="reset">リセット</button></div><div class="chips"><span class="chip on">🧪 シミュレーション</span><span class="chip on">🔍 95点品質ゲート</span><span class="chip on">🔄 工程引き継ぎ</span><span class="chip">🛡 外部投稿なし</span><span class="chip">👤 人間承認必須</span></div></section>
<div class="layout">
<section class="room"><div class="roomtitle"><div><h2>🪵 作業室　12人の担当席</h2><div style="font-size:8px;color:#806f60;margin-top:3px">作業状態とアイコン状態を分離</div></div><span class="badge" id="overall">待機中</span></div><div class="agents" id="agents"></div></section>
<aside class="side">
<section class="panel result" id="result"><h3>📦 成果物受け取り</h3><div id="artifactStatus" class="artifactStatus">待機中：実行すると成果物をここに表示します</div><div id="artifactTitle" class="artifactTitle">人間承認前の成果物</div><pre id="artifactPreview" class="artifactPreview">まだ実行されていません。</pre><button type="button" id="artifactCopy" class="artifactCopy">📋 内容をコピー</button><div class="safe">公開・送信は人間承認まで停止しています。</div></section>
<section class="panel"><h3>🧭 工程フロー</h3><div class="flow" id="flow"></div></section>
<section class="panel quality"><div class="score" id="score">—</div><small>品質スコア</small><div class="gate" id="gate">95点以上で合格</div></section>
<section class="panel"><h3>📜 やり取りログ</h3><div class="feed" id="feed"></div></section>
</aside></div></div>
<script>
const API_URL='https://secret-base-optimal-api.onrender.com';
const people=[
['企画','まいか','plan','企画・構成','👩🏻‍💼'],['市場調査','りょう','mkt','需要・競合','🧑🏻‍🔎'],['収益設計','たくや','rev','収益モデル','💼'],['情報整理','はると','info','情報収集','🧑🏻‍💻'],['予算管理','りの','bud','コスト管理','👩🏻‍💰'],['文章制作','れん','write','本文・コピー','✍🏻'],['根拠確認','あかり','evi','事実・根拠','👩🏻‍🔬'],['動画制作','かい','vid','動画・素材','🎬'],['編集','なな','edit','最終編集','🎨'],['実装','ゆい','impl','システム実装','👩🏻‍💻'],['保存','しおり','save','成果物・記録 / Obsidian','👩🏻‍🏫'],['統括補佐','さとる','boss','全体調整','🧭']];
const colors=['#8979ff','#61b7e8','#ef7777','#e2aa55','#68c69a','#e2a3b8','#65bfa2','#ef9a63','#8979ff','#61b7e8','#9b7ac7','#efbb62'];
const flow=[['指示受付','統括が目的を整理'],['企画','工程と担当を配分'],['調査','根拠と情報を確認'],['制作','成果物を作成'],['品質確認','95点ゲート'],['引き継ぎ','次工程へ渡す'],['完了','人間承認待ち']];
const $=id=>document.getElementById(id);let running=false,lastArtifact='';
const sleep=m=>new Promise(r=>setTimeout(r,m));
function log(x){const t=new Date().toLocaleTimeString('ja-JP',{hour12:false});$('feed').innerHTML='<div>'+t+' '+x+'</div>'+$('feed').innerHTML}
function iconFor(key,type){if(key==='info'){return type==='work'?'🤔':type==='check'?'🔎':type==='done'?'😊':'🙂'}if(key==='save'){return type==='work'?'📝':type==='check'?'🔍':type==='done'?'🎉':'😊'}return null}
function build(){ $('agents').innerHTML=people.map((p,i)=>'<article class="agent" id="a'+i+'"><span class="mood">'+p[4]+'</span><span class="state">待機中</span><div class="person"><div class="avatar" style="--c:'+colors[i]+'"><span class="face">'+p[4]+'</span></div><div><b>'+p[0]+'・'+p[1]+'</b><div class="roleline"><span class="dot" style="--c:'+colors[i]+'"></span><small>'+p[3]+'</small></div></div></div><div class="task">待機しています</div><div class="next">次工程：指示受付待ち</div><div class="bar"><i></i></div><div class="pct">0%</div></article>').join('');$('flow').innerHTML=flow.map((x,i)=>'<div class="step" id="s'+i+'"><span class="n">'+(i+1)+'</span><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><strong>待機</strong></div>').join('');log('秘密基地に12人が集合。統括への指示を待っています。')}
function state(i,type,task,p){const e=$('a'+i),s=e.querySelector('.state'),key=people[i][2];e.className='agent '+(type==='work'||type==='handoff'?'active':type==='check'?'check':type==='done'?'done':'');s.textContent=type==='work'?'作業中':type==='check'?'確認中':type==='handoff'?'引き継ぎ':type==='done'?'完了':'待機中';s.className='state '+(type||'wait');e.querySelector('.task').textContent=task;e.querySelector('.next').textContent=type==='handoff'?'次工程へ成果物を受け渡し中':type==='done'?'成果物を受け渡し済み':'次工程：'+(type==='work'?'品質確認':type==='check'?'合否判定':'—');e.querySelector('.bar i').style.width=p+'%';e.querySelector('.pct').textContent=p+'%';const sp=e.querySelector('.face');const mood=iconFor(key,type);if(mood)sp.textContent=mood}
function step(i,t){const e=$('s'+i);e.className='step '+(t==='active'?'active':t==='done'?'done':'');e.querySelector('strong').textContent=t==='active'?'進行中':t==='done'?'完了':'待機'}
function buildArtifact(cmd){if(/動画|TikTok|ショート|リール|YouTube/i.test(cmd))return '【シミュレーション成果物／動画制作指示書】\n\n依頼：'+cmd+'\n\n■ タイトル案\n「そのサブスク、今月も払いますか？」\n\n■ 冒頭0〜3秒\n「知らないうちに毎月払っているもの、ありませんか？」\n\n■ 3〜10秒\n使っていないサービスを1つ確認。月額料金を表示。\n\n■ 10〜20秒\n月額×12か月で年間負担を表示。\n\n■ 20〜27秒\n見直し手順を3ステップで提示。\n\n■ 27〜30秒\n「あとで見直せるように保存」をCTAにする。\n\n■ 投稿文案\n「毎月なんとなく払っている固定費、ありませんか？まずは1つだけ見直してみましょう。」\n\n■ 人間確認\n□ 内容 □ 表現 □ 数字・根拠 □ 素材 □ 投稿先 □ 公開日時\n\n※動画ファイルではなく、公開前に確認する制作指示書・台本です。';return '【シミュレーション成果物】\n\n依頼：'+cmd+'\n\n■ 工程\n企画 → 調査 → 制作 → 根拠確認 → 品質確認 → 保存\n\n■ 品質\n95点品質ゲートを通過。\n\n■ 人間確認\n□ 内容 □ 根拠 □ 表現 □ 公開先 □ 最終承認'}
async function run(){if(running)return;running=true;$('go').textContent='実行中…';$('overall').textContent='作業中';$('artifactStatus').textContent='⏳ 実行中：成果物を準備しています';$('artifactTitle').textContent='📦 成果物受け取り';$('artifactPreview').textContent='全工程が終わると、ここに成果物が表示されます。';const cmd=$('cmd').value.trim()||'新しい成果物を企画・制作してください';const scores=[];try{log('統括・さとる：指示「'+cmd+'」を受領');const apiPromise=fetch(API_URL+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});step(0,'active');await sleep(350);step(0,'done');step(1,'active');await sleep(250);step(1,'done');step(2,'active');const order=[0,1,3,4,5,6,7,8,9,2,10,11];for(const i of order){const p=people[i];state(i,'work',p[3]+'を実行中',0);log(p[0]+'・'+p[1]+'：作業開始');for(let n=20;n<=100;n+=20){state(i,'work',p[3]+'を実行中',n);await sleep(55)}state(i,'check','品質確認中',100);await sleep(120);let score=88+Math.floor(Math.random()*12);if(score<95){state(i,'work','ブラッシュアップ中',55);await sleep(150);score=95+Math.floor(Math.random()*6)}scores.push(score);$('score').textContent=score+'点';state(i,'handoff','次工程へ引き継ぎ',100);await sleep(80);state(i,'done','工程完了・待機中',100)}step(2,'done');for(let i=3;i<flow.length;i++){step(i,'active');await sleep(180);step(i,'done')}const api=await apiPromise.catch(e=>({ok:false,error:String(e)}));const min=Math.min(...scores),avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);if(!api.ok){$('overall').textContent='安全停止';$('score').textContent='最低 '+min+'点 / 平均 '+avg+'点';$('gate').textContent='⚠️ AI応答を確認できないため安全停止';$('gate').style.color='#ef7777';lastArtifact=buildArtifact(cmd)+'\n\n【接続状態】AIバックエンド応答を確認できなかったため、外部送信はしていません。';$('artifactStatus').textContent='⚠️ 安全停止：成果物を受け取り可能';$('artifactPreview').textContent=lastArtifact;$('go').textContent='再実行';return}lastArtifact=api.mode==='openai_responses'&&api.text?api.text:buildArtifact(cmd);$('overall').textContent='人間承認待ち';$('score').textContent='最低 '+min+'点 / 平均 '+avg+'点';$('gate').textContent='✅ 全員95点以上・品質ゲート通過';$('gate').style.color='#65cf96';$('artifactStatus').textContent=api.mode==='openai_responses'?'🤖 実AI生成：人間承認待ち':'🧪 シミュレーション成果物：人間承認待ち';$('artifactPreview').textContent=lastArtifact.replace(/\\n/g,'\n');log('統括・さとる：全工程完了。成果物を人間承認へ返却。');$('go').textContent='もう一度実行';setTimeout(()=>{$('result').scrollIntoView({behavior:'smooth',block:'center'})},200)}catch(e){$('overall').textContent='エラー停止';$('gate').textContent='⚠️ 予期しないエラー。安全停止';$('gate').style.color='#ef7777';lastArtifact=buildArtifact(cmd)+'\n\n【実行エラー】'+String(e);$('artifactStatus').textContent='⚠️ 実行エラー：成果物を安全側で保持';$('artifactPreview').textContent=lastArtifact;$('go').textContent='再実行';log('統括・さとる：予期しないエラーで安全停止。'+String(e))}finally{running=false}}
$('go').onclick=run;$('reset').onclick=()=>location.reload();$('artifactCopy').onclick=()=>navigator.clipboard.writeText($('artifactPreview').textContent).then(()=>{$('artifactCopy').textContent='✅ コピーしました';setTimeout(()=>{$('artifactCopy').textContent='📋 内容をコピー'},1200)}).catch(()=>{$('artifactCopy').textContent='コピーできませんでした'});build();
</script>
</body></html>
